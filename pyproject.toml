[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "openzone"
version = "0.1.0"
description = "Motore Python per ingestione, standardizzazione, arricchimento e analisi di dati calcistici."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "@sscnapolidata" }]
keywords = ["football", "soccer", "analytics", "xg", "expected-threat", "sports-data"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ingest = [
  "requests>=2.31",
  "soccerdata>=1.8",
  "ScraperFC>=1.5",
  "statsbombpy>=1.14",
  "pyarrow>=15",
]
standardize = [
  "kloppy>=3.17",
  "socceraction>=1.5",
]
warehouse = [
  "duckdb>=1.0",
]
spatial = [
  "networkx>=3.2",
]
models = [
  "scikit-learn>=1.4",
]
viz = [
  "mplsoccer>=1.3",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/marcorzzn/OpenZone"
Repository = "https://github.com/marcorzzn/OpenZone"
Issues = "https://github.com/marcorzzn/OpenZone/issues"

[tool.hatch.build.targets.wheel]
packages = ["openzone"]

[tool.hatch.build.targets.sdist]
include = ["openzone", "tests", "README.md", "LICENSE", "OPENZONE_BLUEPRINT.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not network and not slow\""
markers = [
  "network: test che richiede accesso di rete a una fonte dati esterna",
  "slow: test lento, escluso di default in sviluppo",
]

[tool.coverage.run]
source = ["openzone"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
