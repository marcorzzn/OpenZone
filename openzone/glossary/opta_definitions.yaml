# Id di qualificatore. Compilare dalla fonte ufficiale.
#
# Forma attesa di ogni voce:
#   <qualifier_id>:
#     name: "Nome ufficiale"
#     family: "pass_type" | "body_part" | "set_piece" | "shot_type" | "position" | ...
#     verified: false
#     notes: "Come si comporta quando è assente"
qualifiers:
  140:
    name: "Pass End X"
    family: "position"
    verified: false
    notes: >
      Coordinata x di arrivo del passaggio. Senza questo qualificatore un passaggio
      non ha punto di arrivo e le metriche di progressione non sono calcolabili:
      va trattato come dato mancante, mai come zero.
  141:
    name: "Pass End Y"
    family: "position"
    verified: false
    notes: "Coordinata y di arrivo del passaggio. Vale la stessa avvertenza di 140."

