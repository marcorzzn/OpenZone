# Definizioni Opta: tipi evento e qualificatori
#
# ATTENZIONE — documento incompleto e non verificato.
#
# I type_id qui elencati sono quelli ricorrenti nella documentazione pubblica e nei
# feed Opta (F24) e corrispondono all'uso più diffuso, ma NON sono stati confrontati
# con il documento ufficiale: il campo `verified` è false per ogni voce.
#
# Le mappature vanno completate leggendo:
#   https://www.statsperform.com/opta-event-definitions/
#
# Regola di lavoro: nessuna voce entra in questo file "per sentito dire". Se non è
# verificata sulla fonte primaria, resta fuori dal calcolo e l'evento viene trattato
# come sconosciuto, con un warning. Meglio un buco dichiarato che un numero sbagliato.
#
# I qualificatori sono volutamente quasi vuoti: gli id di qualificatore sono la parte
# più fragile della documentazione pubblica e un errore qui si propaga silenziosamente
# in tutte le metriche derivate. Vanno compilati dalla fonte ufficiale, un blocco per
# volta, con un test che ne verifichi la coerenza sui dati reali.

schema_version: 1
updated: "2026-10-16"
status: incomplete_draft
verified: false
verify_against: "https://www.statsperform.com/opta-event-definitions/"
coordinate_system:
  pitch_size: [100, 100]
  origin: "in alto a sinistra, y crescente verso il basso"
  direction: "x crescente verso la porta avversaria"
  notes: >
    Opta usa un campo normalizzato 100x100. Attenzione: la prima metà della partita
    e la seconda possono presentare la stessa squadra con orientamenti diversi a
    seconda del feed: la normalizzazione dell'orientamento è responsabilità del
    modulo openzone.standardize.

